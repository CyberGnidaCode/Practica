services:
  postgres:
    image: postgres:17
    container_name: dndplatform-postgres
    environment:
      POSTGRES_DB: dnd_platform_storage_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - dndplatform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd_platform_storage_local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  dndplatform-pgdata:

networks:
  app-net:
    external: true
    name: dndplatform-net
